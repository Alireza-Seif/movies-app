{% extends 'link_plant/_base.html' %}
{% block content %}
  <h1 class="text-4xl text-center mb-10">All My Links</h1>
  <div class="lg:w-3/4 w-full mx-auto overflow-auto">
    <table class="table-auto w-full text-left whitespace-nowrap">
      <thead>
        <tr>
          <th
            class="px-4 py-3 title-font tracking-wider font-medium text-gray-900 text-sm bg-gray-100 rounded-tl"
          >
            Text
          </th>
          <th
            class="px-4 py-3 title-font tracking-wider font-medium text-gray-900 text-sm bg-gray-100"
          >
            URL
          </th>
          <th
            class="px-4 py-3 title-font tracking-wider font-medium text-gray-900 text-sm bg-gray-100"
          >
            Profile
          </th>
          <th
            class="px-4 py-3 title-font tracking-wider font-medium text-gray-900 text-sm bg-gray-100 rounded-tr"
          >
            Edit
          </th>
        </tr>
      </thead>
      <tbody>
        {% for link in object_list %}
          <tr>
            <td class="px-4 py-3">{{ link.text }}</td>
            <td class="px-4 py-3">
              <a href="{{ link.url }}" target="_blank">
                {{ link.url }}
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4 inline"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                  />
                </svg>
              </a>
            </td>
            <td class="px-4 py-3">{{ link.profile.name }}</td>
            <td class="px-4 py-3 underline text-blue-600"><a href="#">Edit</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
    <p
      class="mt-6 py-2 w-full border rounded border-gray-400 text-center text-gray-500 hover:cursor-pointer"
    >
      Add New +
    </p>
  </div>

{% endblock content %}
